<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Final</title>
</head>

<body>
    <!--Card 1-->
    <div class="card1">
        <div class="BoxBigAvatar_box">
            <img src="assets/Large avatar profile.png" alt="Photo card 1" class="BigAvatar_image">
        </div>
        <div class="CardWithoutBigImage_card">
            <p class="Big-Text_text" width="942px" height="56px">Hello, PlayerOne!</p>
            <p class="Medium-text_text" width="544.38px" height="52px">Ready for your next adventure? Your friends are
                currently exploring Brookhaven and
                Blox Fruits. Jump back in!</p>
            <div class="icon4and5_icon">
                <div class="boxwithicon4_box">
                    <img src="assets/Icon (4).png" alt="Icon for container" class="icon4_image">
                    <p class="textinbox_text">12 Friends Online</p>
                </div>
                <div class="boxwithicon5_box">
                    <img src="assets/Icon (5).png" alt="Icon for container" class="icon5_image">
                    <p class="textinbox2_text">Level 42 Architect</p>
                </div>
            </div>
        </div>
    </div>
    <!--Card 2-->
    <div class="card2">
        <img src="assets/Background.png" alt="Photo" class="Imageofgame1_image">
        <p class="namegame1_text">Blox Fruits</p>
        <div class="percentoflike1_box">
            <img src="assets/Icon (6).png" alt="Like" class="LikeImage1_image">
            <p class="percent1_text">96%</p>
        </div>
    </div>
    <!--Card 3-->
    <div class="card3">
        <img src="assets/Container.png" alt="Photo" class="Imageofgame2_image">
        <p class="namegame2_text">City Life 2</p>
        <div class="percentoflike2_box">
            <div class="Likeandpercent_box">
                <img src="assets/Icon (6).png" alt="Like" class="LikeImage2_image">
                <p class="percent2_text">98%</p>
            </div>
            <p class="Activepeople_text">4.2k Active</p>
        </div>
    </div>
</body>

</html>

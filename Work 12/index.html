<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Final</title>
</head>

<body>
    <!--Card 1-->
    <div class="card1">
        <div class="BoxBigAvatar">
            <img src="assets/Large avatar profile.png" alt="Photo card 1" class="BigAvatar">
        </div>
        <div class="CardWithoutBigImage">
            <p class="Big-Text" width="942px" height="56px">Hello, PlayerOne!</p>
            <p class="Medium-text" width="544.38px" height="52px">Ready for your next adventure? Your friends are
                currently exploring Brookhaven and
                Blox Fruits. Jump back in!</p>
            <div class="icon4and5">
                <div class="boxwithicon4">
                    <img src="assets/Icon (4).png" alt="Icon for container" class="icon4">
                    <p class="textinbox">12 Friends Online</p>
                </div>
                <div class="boxwithicon5">
                    <img src="assets/Icon (5).png" alt="Icon for container" class="icon5">
                    <p class="textinbox2">Level 42 Architect</p>
                </div>
            </div>
        </div>
    </div>
    <!--Card 2-->
    <div class="card2">
        <img src="assets/Background.png" alt="Photo" class="Imageofgame1">
        <p class="namegame1">Blox Fruits</p>
        <div class="percentoflike1">
            <img src="assets/Icon (6).png" alt="Like" class="LikeImage1">
            <p class="percent1">96%</p>
        </div>
    </div>
    <!--Card 3-->
    <div class="card3">
        <img src="assets/Container.png" alt="Photo" class="Imageofgame2">
        <p class="namegame2">City Life 2</p>
        <div class="percentoflike2">
            <div class="Likeandpercent">
                <img src="assets/Icon (6).png" alt="Like" class="LikeImage2">
                <p class="percent2">98%</p>
            </div>
            <p class="Activepeople">4.2k Active</p>
        </div>
    </div>
</body>

</html>

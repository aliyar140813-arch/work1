<!DOCTYPE html>
<html lang="ru">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KinoHD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:white;
}


/* HEADER */

header{
height:70px;
background:#151515;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 40px;
position:sticky;
top:0;
z-index:20;
}

.logo{
font-size:32px;
font-weight:bold;
color:#e50914;
}

nav a{
color:white;
text-decoration:none;
margin:15px;
cursor:pointer;
}

.search{
background:#222;
border:1px solid #444;
padding:12px 20px;
border-radius:20px;
color:white;
}



/* HERO */

.hero{

height:450px;

background:
linear-gradient(90deg,#000,transparent),
url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba")
center/cover;

display:flex;
align-items:center;
padding:50px;

}

.hero h1{
font-size:55px;
}

.hero p{
margin-top:20px;
max-width:500px;
color:#ddd;
font-size:18px;
}


button{

background:#e50914;
border:0;
color:white;
padding:14px 30px;
border-radius:5px;
cursor:pointer;
font-size:17px;
margin-top:20px;

}


button:hover{
background:#b20710;
}



/* CONTENT */


.container{
padding:40px;
}


.genre{

display:flex;
gap:12px;
flex-wrap:wrap;
margin:20px 0 40px;

}


.genre span{

background:#222;
padding:10px 20px;
border-radius:20px;

}


.movies{

display:grid;
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));

gap:25px;

}



.card{

background:#181818;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.3s;

}


.card:hover{
transform:scale(1.06);
}


.card img{

width:100%;
height:270px;
object-fit:cover;

}


.info{
padding:15px;
}


.rating{
color:#ffd700;
}



/* PLAYER */

.player{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:rgba(0,0,0,.97);

z-index:100;

text-align:center;

padding-top:40px;

}


.player h2{
font-size:32px;
}


video{

width:85%;
max-width:1000px;

margin-top:30px;

background:black;

border-radius:10px;

}


.close{
background:#333;
}



.message{

margin-top:30px;
color:#ff5555;
font-size:20px;

}



@media(max-width:700px){

nav{
display:none;
}

header{
padding:0 15px;
}

.hero{

height:400px;
padding:25px;

}

.hero h1{
font-size:35px;
}

.container{
padding:20px;
}

video{
width:95%;
}

}


</style>

</head>


<body>



<header>

<div class="logo">
KinoHD
</div>


<nav>

<a onclick="home()">Главная</a>

<a onclick="films()">Фильмы</a>

<a onclick="series()">Сериалы</a>

</nav>


<input id="search" class="search" placeholder="Поиск">


</header>





<section class="hero">

<div>

<h1>
Кино онлайн
</h1>


<p>
Смотрите фильмы в хорошем качестве.
Выберите фильм и начните просмотр.
</p>


<button onclick="openMovie('Интерстеллар')">
▶ Смотреть
</button>


</div>

</section>






<div class="container">


<h2>
Категории
</h2>


<div class="genre">

<span>Боевики</span>
<span>Комедии</span>
<span>Фантастика</span>
<span>Ужасы</span>
<span>Сериалы</span>

</div>





<h2>
🔥 Популярные фильмы
</h2>


<div class="movies" id="movies">



<div class="card" onclick="openMovie('Дракон желаний')">

<img src="https://picsum.photos/300/450?1">

<div class="info">

<h3>Дракон желаний</h3>

<p class="rating">
★ 8.7
</p>

</div>

</div>





<div class="card" onclick="openMovie('Супер марио галактическое')">

<img src="https://picsum.photos/300/450?2">

<div class="info">

<h3>Супер марио галактическое</h3>

<p class="rating">
★ 8.7
</p>

</div>

</div>





<div class="card" onclick="openMovie('Дедпул 2')">

<img src="https://picsum.photos/300/450?3">

<div class="info">

<h3>Дедпул 2</h3>

<p class="rating">
★ 8.8
</p>

</div>

</div>



</div>


</div>






<div class="player" id="player">


<h2 id="movieTitle">
Фильм
</h2>


<video id="video" controls></video>


<div class="message" id="message"></div>


<br>


<button class="close" onclick="closeMovie()">
✖ Закрыть фильм
</button>


</div>







<script>


let player=document.getElementById("player");

let video=document.getElementById("video");

let title=document.getElementById("movieTitle");

let message=document.getElementById("message");



let filmsList={


"Дракон желаний":
"movies/drakon-zhelaniy-original.mp4",


"Супер марио галактическое":
"movies/super-mario-galakticheskoe-kino-original.mp4",


"Дедпул 2":
"movies/deadpool-2-original.mp4"
};





function openMovie(name){


title.innerHTML=name;


player.style.display="block";


message.innerHTML="";


video.pause();


video.src=filmsList[name];


video.load();




video.onerror=function(){


message.innerHTML=
"Видео не найдено. Добавьте файл в папку movies";


};




player.scrollIntoView({

behavior:"smooth"

});


}





function closeMovie(){


video.pause();


video.currentTime=0;


video.removeAttribute("src");


video.load();


message.innerHTML="";


player.style.display="none";


}







document.getElementById("search")
.addEventListener("input",function(){


let text=this.value.toLowerCase();


document.querySelectorAll(".card")
.forEach(card=>{


if(card.innerText.toLowerCase().includes(text)){


card.style.display="block";


}else{


card.style.display="none";


}


});


});







function home(){

window.scrollTo({

top:0,

behavior:"smooth"

});

}




function films(){

document.getElementById("movies")
.scrollIntoView({

behavior:"smooth"

});

}





function series(){

alert("Раздел сериалов скоро будет добавлен");

}



</script>


</body>
</html>
